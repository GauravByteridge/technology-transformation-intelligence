# Alembic configuration for App_DB (application state database).
# Migrations are stored in alembic/versions/.
#
# Usage:
#   alembic upgrade head        — Apply all pending migrations
#   alembic downgrade -1        — Roll back one migration
#   alembic revision --autogenerate -m "description"  — Generate migration

[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is set programmatically in env.py from APP_DB_URL.
# Do NOT set it here to avoid hard-coding credentials.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
