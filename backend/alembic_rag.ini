# Alembic configuration for RAG_DB (documents, chunks, embeddings).
# Migrations are stored in alembic_rag/versions/.
#
# Usage:
#   alembic -c alembic_rag.ini upgrade head        — Apply all pending migrations
#   alembic -c alembic_rag.ini downgrade -1        — Roll back one migration
#   alembic -c alembic_rag.ini revision --autogenerate -m "description"

[alembic]
script_location = alembic_rag
prepend_sys_path = .

# sqlalchemy.url is set programmatically in env.py from RAG_DB_URL.
# Do NOT set it here to avoid hard-coding credentials.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
